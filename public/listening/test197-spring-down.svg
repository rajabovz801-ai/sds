<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Spring Down Junior School — Floor Plan</title>
<desc id="desc">School floor plan for Listening Test 197, Questions 18 to 20.</desc>
<rect width="900" height="520" fill="white"/>
<text x="450" y="38" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700">Spring Down Junior School — Floor Plan</text>

<!-- main building outline -->
<path d="M135 90 H765 V380 H640 V455 H135 Z" fill="white" stroke="#111" stroke-width="3"/>

<!-- main hall -->
<rect x="135" y="90" width="245" height="235" fill="white" stroke="#111" stroke-width="2.5"/>
<text x="257" y="215" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22">MAIN HALL</text>

<!-- upper rooms -->
<rect x="380" y="90" width="92" height="92" fill="white" stroke="#111" stroke-width="2.5"/>
<rect x="472" y="90" width="86" height="92" fill="white" stroke="#111" stroke-width="2.5"/>
<rect x="558" y="90" width="72" height="92" fill="white" stroke="#111" stroke-width="2.5"/>
<rect x="630" y="90" width="72" height="92" fill="white" stroke="#111" stroke-width="2.5"/>
<rect x="702" y="90" width="63" height="92" fill="white" stroke="#111" stroke-width="2.5"/>

<text x="426" y="140" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">20 ........</text>
<text x="515" y="140" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">19 ........</text>
<text x="594" y="142" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15">CLASS</text>
<text x="666" y="142" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15">LIBRARY</text>
<text x="733" y="142" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15">CLASS</text>

<!-- doors from upper rooms -->
<g fill="none" stroke="#111" stroke-width="2">
  <path d="M380 182 h18 m0 0 a18 18 0 0 0 -18 18"/>
  <path d="M472 182 h18 m0 0 a18 18 0 0 0 -18 18"/>
  <path d="M558 182 h18 m0 0 a18 18 0 0 0 -18 18"/>
  <path d="M630 182 h18 m0 0 a18 18 0 0 0 -18 18"/>
  <path d="M702 182 h18 m0 0 a18 18 0 0 0 -18 18"/>
</g>

<!-- lower right room / q18 -->
<rect x="620" y="325" width="145" height="130" fill="white" stroke="#111" stroke-width="2.5"/>
<text x="692" y="392" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700">18 ........</text>
<path d="M620 325 v28 m0 0 a28 28 0 0 1 28 -28" fill="none" stroke="#111" stroke-width="2"/>
<path d="M735 325 h30 v30 m0 -30 a30 30 0 0 0 -30 30" fill="none" stroke="#111" stroke-width="2"/>

<!-- corridor / entrance -->
<path d="M380 182 V325 H620" fill="none" stroke="#111" stroke-width="2.5"/>
<path d="M505 455 V425 h38 v30" fill="none" stroke="#111" stroke-width="3"/>
<text x="525" y="486" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15">MAIN ENTRANCE</text>

<!-- direction to other classrooms -->
<line x1="135" y1="468" x2="225" y2="468" stroke="#111" stroke-width="2"/>
<path d="M135 468 l12 -7 v14 z" fill="#111"/>
<text x="178" y="490" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="13">TO OTHER CLASSROOMS</text>

<!-- subtle room labels / reference -->
<text x="450" y="295" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#555">CORRIDOR</text>
