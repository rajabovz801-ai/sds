<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="524" viewBox="0 0 1000 524" role="img" aria-labelledby="title desc">
<title id="title">Solutions to traffic congestion proposed by urban planners and ordinary residents</title>
<desc id="desc">Urban planners: Build more metro lines; Improve public transport; Charge drivers to enter the city centre; Create smart traffic light systems; Limit the number of cars per household. Ordinary residents: Make bus tickets cheaper; Share rides with colleagues; Improve public transport; Build more cycle lanes; Work from home more often. Improve public transport is proposed by both groups.</desc>
